version: "3.9"

services:
  backend:
    image: python:3.12-slim
    container_name: telegram-sentinel-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: tail -f /dev/null

  frontend:
    image: node:22-alpine
    container_name: telegram-sentinel-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: tail -f /dev/null
